# Programme definitions — pattern families, not verified programme identities.
#
# IMPORTANT: these entries are HYPOTHESES about how each channel titles its bulletins and talk
# output. They have not been validated against real titles, because the feasibility probe never
# produced data (docs/FEASIBILITY.md). SPEC-002 must validate them against real listings and
# correct or delete entries that match nothing.
#
# Consequence, by design: a video matching no pattern is stored with programme_id = NULL and
# counted as unclassified. An empty guess is worse than a NULL, and the unclassified share is
# itself a number the agenda analysis must report.
#
# `type` is one of news | talk | interview.
schema_version: 1

