# Programme definitions — VALIDATED against real listings on 2026-11-12.
#
# Evidence: 12 recent uploads per channel were read (flat listing, no downloads) and the title
# vocabulary recorded. The earlier version of this file guessed markers ("ამბები", "სიახლე") that
# NONE of the six channels actually use; those guesses are gone. What remains below is what the
# titles actually show.
#
# Deliberately absent: a programme entry for a channel where no marker was observed. Inventing
# "postv_news" or "pirveli_news" would produce a programme that can never match, and the honest
# outcome for those videos is programme_id = NULL. The unclassified share is itself a number the
# agenda analysis must report.
#
# Known limitation, recorded for SPEC-002: several channels publish individual STORY CLIPS
# ("ევროპელი ლიდერების სამიტი დუბლინში | ...") rather than full bulletins, so a title often names
# no programme at all. Programme-level analysis may therefore be impossible for those channels,
# while channel-level analysis remains valid. This is a scope question for SPEC-002, not something
# to paper over with a loose pattern.
#
# `type` is one of news | talk | interview.
schema_version: 1

programmes:
  # ---- news bulletins (marker observed) ------------------------------------------------
  - programme_id: imedi_news
    channel_id: imedi
    name_en: Chronicle (news bulletin)
    name_ka: ქრონიკა
    type: news
    title_patterns: ["ქრონიკა"]
    playlist_ids: []

  - programme_id: rustavi2_news
    channel_id: rustavi2
    name_en: Courier (news bulletin)
    name_ka: კურიერი
    type: news
    title_patterns: ["კურიერი"]
    playlist_ids: []

  - programme_id: gpb_news
    channel_id: gpb
    name_en: Moambe (news bulletin)
    name_ka: მოამბე
    type: news
    title_patterns: ["მოამბე"]
    playlist_ids: []

  # ---- talk / interview (marker observed) ----------------------------------------------
  - programme_id: rustavi2_talk
    channel_id: rustavi2
    name_en: Midday / Morning show
    name_ka: შუადღე, დილა მშვიდობისა საქართველო
    type: talk
    title_patterns: ["შუადღე", "დილა მშვიდობისა"]
    playlist_ids: []

  - programme_id: postv_talk
    channel_id: postv
    name_en: Zura's Show / Political rubric
    name_ka: ზურას შოუ, პოლიტრუბრიკა
    type: talk
    title_patterns: ["ზურას შოუ", "პოლიტრუბრიკა", "პოლიტიკური ცირკი"]
    playlist_ids: []

  - programme_id: formula_talk
    channel_id: formula
    name_en: Context (analysis talk)
    name_ka: კონტექსტი
    type: talk
    title_patterns: ["კონტექსტი"]
    playlist_ids: []

  - programme_id: formula_interview
    channel_id: formula
    name_en: Extended interview
    name_ka: ვრცელი ინტერვიუ
    type: interview
    title_patterns: ["ინტერვიუ"]
    playlist_ids: []

  - programme_id: pirveli_talk
    channel_id: pirveli
    name_en: First Line (talk)
    name_ka: პირველ ხაზში
    type: talk
    title_patterns: ["პირველ ხაზში"]
    playlist_ids: []
